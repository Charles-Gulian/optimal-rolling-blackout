# Lean environment for running simulations on SAVIO.
#
#   conda env create -f environment-savio.yml
#   conda activate optimal-rolling-blackout
#
# The name must match the `conda activate` line in run_simulation.sh.
#
# This is deliberately NOT environment.yml. That one carries the data
# generation stack -- jupyter, netcdf4, ffmpeg, dask -- for the NSRDB pulls
# and demand.ninja, none of which ever run on the cluster, and which are the
# packages most likely to make a conda solve slow or fail there.
#
# Versions are pinned to what the results were produced with locally, so a
# cluster run is comparable rather than subtly different.
#
# gurobipy comes from pip rather than the gurobi conda channel: it tracks the
# current release more closely and avoids a second channel in the solve. The
# licence is read from ~/gurobi.lic.
name: optimal-rolling-blackout
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy=2.1.3
  - pandas=2.2.3
  - scipy=1.15.1          # cvxpy dependency
  - matplotlib-base=3.10  # system.py imports pyplot at module level
  - pip
  - pip:
      - cvxpy==1.6.3
      - gurobipy==12.0.1
